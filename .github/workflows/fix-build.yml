name: Fix build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to update
        required: true
        default: v0.9.1

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check the version and build
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $source = Get-Content src/lib/build.ts -Raw
          $build = [regex]::Match($source, 'BUILD_NUMBER\s*=\s*(\d+)').Groups[1].Value
          Write-Host "bubo $version build $build into $tag"
          if ($version -ne $tag.TrimStart("v")) { throw "package.json is $version, the tag is $tag" }
          $notes = "release-notes/${version}.build${build}.md"
          $notesPt = "release-notes/${version}.build${build}.pt.md"
          if (-not (Test-Path $notes)) { throw "missing $notes for build $build" }
          if (-not (Test-Path $notesPt)) { throw "missing $notesPt for build $build" }

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      - name: Stage release assets
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $version = $tag.TrimStart("v")
          $source = Get-Content src/lib/build.ts -Raw
          $build = [regex]::Match($source, 'BUILD_NUMBER\s*=\s*(\d+)').Groups[1].Value
          $notes = "release-notes/${version}.build${build}.md"
          $notesPt = "release-notes/${version}.build${build}.pt.md"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/bubo_*_x64-setup.exe" | Select-Object -First 1
          if (-not (Test-Path "$($installer.FullName).sig")) { throw "missing updater signature" }
          Copy-Item $installer.FullName "bubo-setup.exe" -Force
          node scripts/updater-json.mjs --tag=$tag --installer="$($installer.FullName)" --signature="$($installer.FullName).sig" --notes="$notes" --notes-pt="$notesPt"

      - name: Update the existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/bubo_*_x64-setup.exe" | Select-Object -First 1
          gh release upload "${{ inputs.tag }}" "bubo-setup.exe" $installer.FullName "$($installer.FullName).sig" "latest.json" --clobber

      - name: Mark the release title with this build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          $version = $tag.TrimStart("v")
          $source = Get-Content src/lib/build.ts -Raw
          $build = [regex]::Match($source, 'BUILD_NUMBER\s*=\s*(\d+)').Groups[1].Value
          $notes = "release-notes/${version}.build${build}.md"
          if (-not (Test-Path $notes)) { throw "missing $notes for build $build" }
          $body = Get-Content $notes -Raw
          gh release edit $tag --title "bubo $tag build $build" --notes "Build $build of $tag.`n`n$body"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bubo-setup-fix
          path: |
            bubo-setup.exe
            latest.json
