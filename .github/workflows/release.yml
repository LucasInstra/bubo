name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check version matches the tag
        shell: bash
        run: node scripts/sync-version.mjs --check --expect="${{ github.ref_name }}"

      - name: Check the release notes exist
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in "release-notes/${version}.md" "release-notes/${version}.pt.md"; do
            if [ ! -f "$file" ]; then
              echo "::error::missing $file for ${{ github.ref_name }}"
              exit 1
            fi
          done

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          file="release-notes/${version}.md"
          if [ -f "$file" ]; then
            body="$(cat "$file")"
          else
            body="See the assets below. Unsigned build; Windows SmartScreen may warn on first run."
          fi
          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: bubo ${{ github.ref_name }} build 1
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # v1 renamed the option; keep it off so our own manifest is the only one.
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true

      - name: Add a stable direct-download asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "src-tauri/target/release/bundle/nsis/bubo_${version}_x64-setup.exe" bubo-setup.exe

      - name: Add a portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path "src-tauri/target/release/bubo.exe" -DestinationPath "bubo-portable-x64.zip" -Force
          gh release upload "${{ github.ref_name }}" "bubo-portable-x64.zip" --clobber
          gh release upload "${{ github.ref_name }}" bubo-setup.exe --clobber

      - name: Publish the updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $installer = "src-tauri/target/release/bundle/nsis/bubo_${version}_x64-setup.exe"
          node scripts/updater-json.mjs --tag=$tag --installer="$installer" --signature="$installer.sig" --notes="release-notes/${version}.md" --notes-pt="release-notes/${version}.pt.md"
          gh release upload $tag latest.json --clobber
