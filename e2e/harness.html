<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>bubo e2e harness</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        background: #0a0910;
        overflow: hidden;
      }
      #root {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import "/src/styles.css";
      import React from "react";
      import { createRoot } from "react-dom/client";
      import App from "/src/App.tsx";
      import { Drill } from "/src/components/Drill.tsx";
      import { PopupView } from "/src/components/PopupView.tsx";
      import { DEFAULT_SETTINGS } from "/src/lib/types.ts";
      import pkg from "../package.json";

      const params = new URLSearchParams(location.search);
      const mode = params.get("case") ?? "app";
      const nextVersion = (() => {
        const [major, minor] = pkg.version.split(".");
        return `${major}.${Number(minor) + 1}.0`;
      })();
      const compact =
        mode === "compact" ||
        mode === "compact-bilingual" ||
        mode === "compact-switched" ||
        mode === "compact-update";
      const popup = mode === "popup" || mode === "popup-reply" || mode === "popup-update";
      const switched = mode === "switched" || mode === "compact-switched";
      const bilingual =
        mode === "bilingual" || mode === "bilingual-a1" || mode === "compact-bilingual";
      const level =
        params.get("level") ?? (mode === "bilingual-a1" ? "A1" : DEFAULT_SETTINGS.level);
      const updateAvailable =
        mode === "update" ||
        mode === "onboarding-update" ||
        mode === "compact-update" ||
        mode === "popup-update";
      const width = popup ? 380 : compact ? 400 : 420;
      const height = popup ? 380 : compact ? 280 : 640;

      Object.defineProperty(window, "innerWidth", { configurable: true, get: () => width });
      const rootElement = document.getElementById("root");
      rootElement.style.width = `${width}px`;
      rootElement.style.height = `${height}px`;
      rootElement.style.overflow = "hidden";

      const settings = {
        ...DEFAULT_SETTINGS,
        compact,
        popup,
        hotkey: "Ctrl+Alt+B",
        noteLanguage: "en",
        level,
        replyLanguage: bilingual ? "bilingual" : DEFAULT_SETTINGS.replyLanguage,
      };
      const stored = [
        {
          id: 1,
          role: "user",
          content: "my weekend was cool, i went to the beach",
          fixes: null,
          createdAt: 1,
        },
        {
          id: 2,
          role: "assistant",
          content: "That sounds like a good weekend. Was the water warm?",
          fixes:
            '[{"wrong":"i go to the gym yesterday","right":"I went to the gym yesterday","note":"past simple"}]',
          createdAt: 2,
        },
      ];

      const bilingualStored = [
        ...stored,
        {
          id: 3,
          role: "assistant",
          content:
            "Isso parece um bom fim de semana. A água estava quente?\nEN: That sounds like a good weekend. Was the water warm?",
          fixes: null,
          createdAt: 3,
        },
      ];

      const switchedStored = [
        ...stored,
        {
          id: 3,
          role: "assistant",
          content:
            "Isso parece um bom fim de semana. A água estava quente?\nEN: That sounds like a good weekend. Was the water warm?",
          fixes: null,
          createdAt: 3,
        },
        {
          id: 4,
          role: "assistant",
          content:
            "That sounds like a good weekend.\nPT: Isso parece um bom fim de semana.",
          fixes: null,
          createdAt: 4,
        },
      ];

      const drillItem = {
        id: 1,
        wrong: "i go to the gym yesterday",
        right: "I went to the gym yesterday",
        note: "past simple",
        streak: 2,
        seen: 3,
        context: "i go to the gym yesterday and i feel good",
      };

      const dayStats = Array.from({ length: 14 }, (_, index) => {
        const date = new Date();
        date.setDate(date.getDate() - (13 - index));
        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(
          date.getDate(),
        ).padStart(2, "0")}`;
        const messages = [0, 2, 1, 3, 0, 2, 4, 1, 0, 3, 2, 5, 1, 2][index];
        const reviews = [0, 1, 0, 2, 1, 0, 3, 1, 2, 0, 1, 4, 0, 2][index];
        return { date: key, messages, reviews, correct: Math.round(reviews * 0.75) };
      });

      const now = Date.now();
      const day = 86_400_000;
      let lessonProgress = [];
      let savedKey = mode !== "onboarding" && mode !== "onboarding-update";

      const handlers = {
        get_settings: () => settings,
        has_api_key: () =>
          savedKey ||
          /(?:localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)/i.test(settings.baseUrl),
        save_api_key: ({ key }) => {
          savedKey = Boolean(key);
          return null;
        },
        "plugin:app|version": () => pkg.version,
        // Always offer one minor above the running version, so the update
        // surfaces stay testable across releases.
        "plugin:updater|check": () =>
          updateAvailable
            ? {
                rid: 1,
                currentVersion: pkg.version,
                version: nextVersion,
                date: new Date().toISOString(),
                body: "## What's new\n\n- The mascot speaks up.",
                rawJson: {
                  version: nextVersion,
                  build: 1,
                  notes_pt: "## Novidades\n\n- **Fala do mascote**: o bubo avisa quando há uma versão nova.",
                },
              }
            : null,
        history: () =>
          mode === "empty" ? [] : bilingual ? bilingualStored : switched ? switchedStored : stored,
        open_session: ({ id }) => {
          const contents = {
            1: [{ id: 1, role: "user", content: "weekend at the beach", fixes: null, createdAt: 1 }],
            2: [
              { id: 2, role: "user", content: "coffee order practice", fixes: null, createdAt: 2 },
            ],
            3: [
              { id: 3, role: "user", content: "interview small talk", fixes: null, createdAt: 3 },
            ],
          };
          return contents[id] ?? [];
        },
        current_session: () => 1,
        lesson_progress: () => lessonProgress,
        save_lesson_progress: ({ lessonId, step, completed }) => {
          lessonProgress = lessonProgress.filter((row) => row.lessonId !== lessonId);
          lessonProgress.push({ lessonId, step, completed, updatedAt: Date.now() });
          return null;
        },
        save_lesson_fix: () => null,
        save_assistant_message: () => 99,
        list_sessions: () => [
          {
            id: 1,
            title: "A weekend at the beach",
            createdAt: now - 2 * day,
            updatedAt: now - 3_600_000,
            messages: 2,
            preview: "my weekend was cool, i went to the beach",
          },
          {
            id: 2,
            title: "Coffee order practice",
            createdAt: now - 4 * day,
            updatedAt: now - 2 * day,
            messages: 6,
            preview: "can i get a flat white to go",
          },
          {
            id: 3,
            title: "Interview small talk",
            createdAt: now - 8 * day,
            updatedAt: now - 5 * day,
            messages: 8,
            preview: "tell me about yourself",
          },
        ],
        drill_stats: () => (mode === "empty" ? { total: 0, due: 0 } : { total: 6, due: 2 }),
        drill_next: () => drillItem,
        drill_review: () => ({ ...drillItem, streak: 3 }),
        drill_focus: () => drillItem,
        delete_fix: () => null,
        explain_fix: () =>
          "Use the past simple for a finished action. Add a time marker when it helps.\n\nI went to the gym yesterday. She called me last night.",
        set_compact: () => null,
        set_popup: () => null,
        set_popup_stage: () => null,
        "plugin:window|outer_position": () => ({ x: 0, y: 0 }),
        "plugin:window|set_position": () => null,
        save_settings: ({ settings: next }) => {
          Object.assign(settings, next);
          return null;
        },
        open_feedback: () => null,
        progress_stats: () => ({
          streak: 4,
          messages: 42,
          cards: 6,
          due: 2,
          reviews: 18,
          correct: 14,
          accuracy: 0.78,
          days: dayStats,
          top: [
            {
              wrong: "i go to the gym yesterday",
              right: "I went to the gym yesterday",
              note: "past simple",
              streak: 2,
              seen: 5,
              attempts: 4,
              correct: 3,
            },
            {
              wrong: "she don't know",
              right: "she doesn't know",
              note: "third person",
              streak: 1,
              seen: 3,
              attempts: 3,
              correct: 2,
            },
            {
              wrong: "i have 20 years",
              right: "I am 20 years old",
              note: "age with be",
              streak: 0,
              seen: 2,
              attempts: 2,
              correct: 1,
            },
          ],
        }),
        test_connection: () => ({
          message: "Connected, 3 model(s) available",
          models: ["gpt-4.1-mini", "gpt-4.1", "gpt-4o-mini"],
        }),
      };

      const calls = [];
      window.__calls = calls;
      window.__TAURI_INTERNALS__ = {
        invoke: async (cmd, args) => {
          calls.push({ cmd, args });
          return handlers[cmd] ? handlers[cmd](args) : null;
        },
        transformCallback: () => 0,
        unregisterCallback: () => {},
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { windowLabel: "main", label: "main" },
        },
      };

      const root = createRoot(rootElement);
      if (mode === "practice") {
        root.render(React.createElement(Drill, { onClose: () => {} }));
      } else if (mode === "popup-reply") {
        root.render(
          React.createElement(PopupView, {
            settings,
            messages: switchedStored,
            status: "idle",
            mood: "happy",
            stage: "reply",
            onShowInput: () => {},
            onSend: () => false,
            onStop: () => {},
            onOpenChat: () => {},
          }),
        );
      } else {
        root.render(React.createElement(App));
      }
    </script>
  </body>
</html>
